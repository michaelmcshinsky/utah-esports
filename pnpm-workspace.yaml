packages:
  - "apps/*"
  - "packages/*"

# Netlify's Next.js adapter bundles the server function from node_modules and
# the deploy zip does NOT preserve symlinks. pnpm's default isolated linker
# (and public-hoist, which still symlinks into .pnpm) leaves `next` unresolvable
# in the function → "Cannot find module 'next/dist/server/lib/start-server.js'".
# `hoisted` gives a flat, symlink-free layout like npm — the only layout that
# survives bundling. https://opennext.js.org/netlify#pnpm-support
nodeLinker: hoisted

# Belt & braces for tools that still read hoist patterns.
publicHoistPattern:
  - "*"

allowBuilds:
  esbuild: true
  sharp: true
